{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px; text-align: center;">Welcome to MoviePants!</h2>
    <p style="text-align: center; margin-bottom: 30px; color: #666;">
        Create a session to pick a movie with your friends, or join an existing session.
    </p>

    <div style="display: grid; gap: 20px;">
        <div>
            <h3 style="margin-bottom: 15px;">Create New Session</h3>
            <button class="btn btn-primary" onclick="createSession()" style="width: 100%;">
                Create Session
            </button>
        </div>

        <div style="border-top: 2px solid #eee; padding-top: 20px;">
            <h3 style="margin-bottom: 15px;">Join Existing Session</h3>
            <input type="text" id="joinSessionId" placeholder="Enter session ID">
            <button class="btn btn-secondary" onclick="joinSession()" style="width: 100%;">
                Join Session
            </button>
        </div>
    </div>

    <div id="message" style="margin-top: 20px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function createSession() {
        try {
            const response = await fetch('/create-session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            const data = await response.json();

            if (data.session_id) {
                window.location.href = `/session/${data.session_id}`;
            }
        } catch (error) {
            document.getElementById('message').innerHTML =
                '<div class="error">Failed to create session</div>';
        }
    }

    function joinSession() {
        const sessionId = document.getElementById('joinSessionId').value.trim();
        if (!sessionId) {
            document.getElementById('message').innerHTML =
                '<div class="error">Please enter a session ID</div>';
            return;
        }
        window.location.href = `/session/${sessionId}`;
    }
</script>
{% endblock %}
